[build]
  command = "npm run build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Former sector pages now point to the transversal projects page (permanent).
[[redirects]]
  from = "/avvocati"
  to = "/progetti/"
  status = 301
  force = true

[[redirects]]
  from = "/avvocati/*"
  to = "/progetti/"
  status = 301
  force = true

[[redirects]]
  from = "/medici"
  to = "/progetti/"
  status = 301
  force = true

[[redirects]]
  from = "/medici/*"
  to = "/progetti/"
  status = 301
  force = true

[[redirects]]
  from = "/professionisti"
  to = "/progetti/"
  status = 301
  force = true

[[redirects]]
  from = "/professionisti/*"
  to = "/progetti/"
  status = 301
  force = true

[[redirects]]
  from = "/en/avvocati"
  to = "/en/progetti/"
  status = 301
  force = true

[[redirects]]
  from = "/en/avvocati/*"
  to = "/en/progetti/"
  status = 301
  force = true

[[redirects]]
  from = "/en/medici"
  to = "/en/progetti/"
  status = 301
  force = true

[[redirects]]
  from = "/en/medici/*"
  to = "/en/progetti/"
  status = 301
  force = true

[[redirects]]
  from = "/en/professionisti"
  to = "/en/progetti/"
  status = 301
  force = true

[[redirects]]
  from = "/en/professionisti/*"
  to = "/en/progetti/"
  status = 301
  force = true
